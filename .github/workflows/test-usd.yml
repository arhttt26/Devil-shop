name: Test USD Price

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get USD price from TGJU
        shell: bash
        run: |
          python3 <<'PY'
          import urllib.request
          import re
          from html import unescape
          from html.parser import HTMLParser

          url = "https://www.tgju.org/profile/price_dollar_rl"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("Page downloaded.")
          print("Page size:", len(html))

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          parser = TextParser()
          parser.feed(html)

          text = unescape(
              " ".join(parser.parts)
          )

          # تبدیل فاصله‌های اضافی
          text = re.sub(
              r"\s+",
              " ",
              text
          )

          # پیدا کردن جمله‌ای که TGJU قیمت دلار را در آن اعلام می‌کند
          patterns = [
              r"قیمت هر دلار\s+([0-9۰-۹٬,]+)\s*ریال",
              r"قیمت دلار\s+([0-9۰-۹٬,]+)\s*ریال",
              r"نرخ فعلی[:\s]+([0-9۰-۹٬,]+)",
              r"Last[:\s]+([0-9,]+)"
          ]

          match = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              print("Could not find USD price.")
              print("Relevant text sample:")
              print(text[:5000])

              raise Exception(
                  "USD price not found on TGJU"
              )

          raw = match.group(1)

          # اعداد فارسی → انگلیسی
          translation = str.maketrans(
              "۰۱۲۳۴۵۶۷۸۹",
              "0123456789"
          )

          raw = raw.translate(
              translation
          )

          # حذف کاما و جداکننده‌ها
          digits = re.sub(
              r"[^0-9]",
              "",
              raw
          )

          if not digits:
              raise Exception(
                  "USD price is not numeric"
              )

          usd_rial = int(digits)

          if not (
              1_000_000
              <= usd_rial
              <= 10_000_000
          ):
              raise Exception(
                  f"Invalid USD Rial price: {usd_rial}"
              )

          usd_toman = round(
              usd_rial / 10
          )

          print("==============================")
          print("USD Rial :", usd_rial)
          print("USD Toman:", usd_toman)
          print("==============================")
          PY

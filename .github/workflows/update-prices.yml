name: Update Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update prices
        env:
          APIFRAGMENT_TOKEN: ${{ secrets.APIFRAGMENT_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          FILE = "data/prices.json"

          TGJU = "https://www.tgju.org/profile/price_dollar_rl"

          GRAM = (
              "https://api.coingecko.com/api/v3/simple/price"
              "?ids=the-open-network&vs_currencies=usd"
          )

          FRAGMENT = "https://apifragment.online/price"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/html,*/*"
          }

          def get(url, headers=None, retries=3):
              h = dict(HEADERS)
              if headers:
                  h.update(headers)

              last = None

              for i in range(retries):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers=h,
                          method="GET"
                      )

                      with urllib.request.urlopen(
                          req,
                          timeout=30
                      ) as r:
                          return r.read().decode(
                              "utf-8",
                              errors="replace"
                          )

                  except Exception as e:
                      last = e
                      print(
                          f"Request failed "
                          f"({i + 1}/{retries}): {e}"
                      )

                      if i < retries - 1:
                          time.sleep(3)

              raise last

          def get_json(url, headers=None):
              return json.loads(
                  get(
                      url,
                      headers=headers
                  )
              )

          def clean_number(value):
              value = str(value)

              value = value.translate(
                  str.maketrans(
                      "۰۱۲۳۴۵۶۷۸۹",
                      "0123456789"
                  )
              )

              value = value.replace(",", "")
              value = value.replace("٬", "")
              value = value.replace(" ", "")
              value = value.replace("\u200c", "")

              return value

          # ---------------------------------------------------------
          # LOAD EXISTING DATA
          # ---------------------------------------------------------

          with open(
              FILE,
              "r",
              encoding="utf-8"
          ) as f:
              prices = json.load(f)

          old_usd = prices.get("usdToman")
          old_gram = prices.get("gramUsd")
          old_star = prices.get(
              "starUsd",
              0.015
          )
          old_premium = prices.get(
              "premium",
              []
          )

          print("Old USD/Toman:", old_usd)
          print("Old GRAM USD:", old_gram)
          print("Old Stars USD:", old_star)

          # ---------------------------------------------------------
          # USD FROM TGJU
          # ---------------------------------------------------------

          usd_toman = old_usd

          try:
              print("\nFetching USD from TGJU...")

              html = get(TGJU)

              print(
                  "TGJU page size:",
                  len(html)
              )

              candidates = []

              # Method 1:
              # Search around price_dollar_rl
              for match in re.finditer(
                  r"price_dollar_rl",
                  html,
                  re.I
              ):
                  part = html[
                      max(0, match.start() - 2000):
                      match.start() + 5000
                  ]

                  nums = re.findall(
                      r"[0-9۰-۹]{1,3}(?:[,٬][0-9۰-۹]{3})+",
                      part
                  )

                  for n in nums:
                      n = clean_number(n)

                      try:
                          value = int(n)
                      except:
                          continue

                      if 100000 <= value <= 20000000:
                          candidates.append(value)

              # Method 2:
              # Look for "نرخ فعلی"
              for match in re.finditer(
                  r"نرخ\s*فعلی",
                  html,
                  re.I
              ):
                  part = html[
                      match.start():
                      match.start() + 3000
                  ]

                  nums = re.findall(
                      r"[0-9۰-۹]{1,3}(?:[,٬][0-9۰-۹]{3})+",
                      part
                  )

                  for n in nums:
                      n = clean_number(n)

                      try:
                          value = int(n)
                      except:
                          continue

                      if 100000 <= value <= 20000000:
                          candidates.append(value)

              # Remove duplicates
              candidates = list(
                  dict.fromkeys(candidates)
              )

              print(
                  "TGJU candidates:",
                  candidates[:20]
              )

              if not candidates:
                  raise RuntimeError(
                      "No valid USD value found"
                  )

              # Prefer a value close to the previous
              # price if available.
              if old_usd:
                  old_rial = old_usd * 10

                  candidates.sort(
                      key=lambda x: abs(
                          x - old_rial
                      )
                  )

                  usd_rial = candidates[0]

              else:
                  usd_rial = candidates[0]

              usd_toman = round(
                  usd_rial / 10
              )

              # Safety check.
              if not (
                  10000 <= usd_toman <= 2000000
              ):
                  raise RuntimeError(
                      f"Invalid USD/Toman: {usd_toman}"
                  )

              print(
                  "USD Rial:",
                  usd_rial
              )

              print(
                  "USD Toman:",
                  usd_toman
              )

          except Exception as e:
              print(
                  "TGJU failed:",
                  e
              )

              print(
                  "Keeping previous USD/Toman:",
                  old_usd
              )

          # ---------------------------------------------------------
          # GRAM / TONCOIN
          # ---------------------------------------------------------

          gram_usd = old_gram

          try:
              print("\nFetching GRAM...")

              data = get_json(GRAM)

              value = (
                  data
                  .get("the-open-network", {})
                  .get("usd")
              )

              if value is None:
                  raise RuntimeError(
                      "GRAM price missing"
                  )

              gram_usd = float(value)

              if gram_usd <= 0:
                  raise RuntimeError(
                      "Invalid GRAM price"
                  )

              print(
                  "GRAM USD:",
                  gram_usd
              )

          except Exception as e:
              print(
                  "GRAM failed:",
                  e
              )

              print(
                  "Keeping previous GRAM:",
                  old_gram
              )

          # ---------------------------------------------------------
          # APIFRAGMENT
          # ---------------------------------------------------------

          star_usd = old_star
          premium = old_premium
          fragment_ok = False

          token = os.environ.get(
              "APIFRAGMENT_TOKEN"
          )

          if token:

              print(
                  "\nAPIFRAGMENT_TOKEN found."
              )

              fragment_headers = {
                  "Authorization":
                      "Bearer " + token
              }

              # -----------------------------------------------------
              # STARS
              # -----------------------------------------------------

              try:
                  url = (
                      FRAGMENT
                      + "?product=stars"
                      + "&quantity=1000"
                  )

                  print(
                      "Requesting Stars:",
                      url
                  )

                  data = get_json(
                      url,
                      fragment_headers
                  )

                  if data.get("unit_usdt") is not None:

                      star_usd = float(
                          data["unit_usdt"]
                      )

                  elif data.get("price_usdt") is not None:

                      star_usd = (
                          float(
                              data["price_usdt"]
                          ) / 1000
                      )

                  else:
                      raise RuntimeError(
                          "Stars USD missing"
                      )

                  if star_usd <= 0:
                      raise RuntimeError(
                          "Invalid Stars USD"
                      )

                  fragment_ok = True

                  print(
                      "Stars USD:",
                      star_usd
                  )

              except Exception as e:
                  print(
                      "Stars failed:",
                      e
                  )

                  print(
                      "Keeping old Stars:",
                      old_star
                  )

              # -----------------------------------------------------
              # PREMIUM
              # -----------------------------------------------------

              new_premium = []

              for months, key, name in [
                  (
                      3,
                      "prem3m",
                      "پریمیوم 3 ماهه"
                  ),
                  (
                      6,
                      "prem6m",
                      "پریمیوم 6 ماهه"
                  ),
                  (
                      12,
                      "prem1y",
                      "پریمیوم 1 ساله"
                  )
              ]:

                  try:
                      url = (
                          FRAGMENT
                          + "?product=premium"
                          + f"&quantity={months}"
                      )

                      print(
                          f"Requesting Premium {months}m:",
                          url
                      )

                      data = get_json(
                          url,
                          fragment_headers
                      )

                      value = data.get(
                          "price_usdt"
                      )

                      if value is None:
                          raise RuntimeError(
                              "Premium USD missing"
                          )

                      value = float(value)

                      if value <= 0:
                          raise RuntimeError(
                              "Invalid Premium USD"
                          )

                      new_premium.append({
                          "key": key,
                          "name": name,
                          "usd": value
                      })

                      fragment_ok = True

                      print(
                          f"Premium {months}m USD:",
                          value
                      )

                  except Exception as e:

                      print(
                          f"Premium {months}m failed:",
                          e
                      )

                      old_item = next(
                          (
                              x for x in old_premium
                              if x.get("key") == key
                          ),
                          None
                      )

                      if old_item:

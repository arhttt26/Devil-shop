name: Update Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prices
        env:
          APIFRAGMENT_TOKEN: ${{ secrets.APIFRAGMENT_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, re, time
          import urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta

          FILE = "data/prices.json"

          TGJU = "https://www.tgju.org/profile/price_dollar_rl"
          GRAM = "https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd"
          FRAGMENT = "https://apifragment.online/price"

          STALE_AFTER = timedelta(minutes=60)   # failure longer than this => stale=true
          HEARTBEAT = timedelta(hours=6)        # refresh updatedAt at least this often
          MAX_CHANGE = 0.25                     # reject jumps bigger than 25% in one run

          now = datetime.now(timezone.utc)
          iso = lambda d: d.isoformat(timespec="seconds")

          # -------------------------
          # Helpers
          # -------------------------
          def get(url, headers=None, tries=3):
              req = urllib.request.Request(
                  url, headers=headers or {"User-Agent": "Mozilla/5.0"}
              )
              for i in range(tries):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", errors="ignore")
                  except urllib.error.HTTPError as e:
                      # retry only on server errors / rate limit
                      if (e.code < 500 and e.code != 429) or i == tries - 1:
                          raise
                  except Exception:
                      if i == tries - 1:
                          raise
                  time.sleep(3 * (i + 1))

          def get_json(url, headers=None):
              return json.loads(get(url, headers))

          def number(x):
              if x is None:
                  return None
              x = str(x).replace(",", "").replace("٬", "").strip()
              try:
                  return float(x)
              except Exception:
                  return None

          def accept(old, new):
              """Validate a new value against the old one."""
              if new is None or new <= 0:
                  raise ValueError("missing value")
              if old and abs(new - old) / old > MAX_CHANGE:
                  raise ValueError(f"suspicious change {old} -> {new}")
              return new

          with open(FILE, "r", encoding="utf-8") as f:
              original_text = f.read()
          data = json.loads(original_text)

          sources = data.setdefault("sources", {})

          def success(name, changed):
              s = sources.setdefault(name, {})
              recovered = bool(s.get("failedSince") or s.get("stale"))
              s.pop("failedSince", None)
              s.pop("error", None)
              s["stale"] = False
              last = s.get("updatedAt")
              old_enough = (not last) or (now - datetime.fromisoformat(last) >= HEARTBEAT)
              if changed or recovered or old_enough:
                  s["updatedAt"] = iso(now)

          def fail(name, err):
              s = sources.setdefault(name, {})
              s.setdefault("failedSince", iso(now))
              s["error"] = str(err)[:80]
              since = datetime.fromisoformat(s["failedSince"])
              s["stale"] = (now - since) >= STALE_AFTER
              print(f"::warning::{name} failed: {err}")

          # -------------------------
          # USD / TOMAN - TGJU
          # -------------------------
          old_usd = number(data.get("usdToman"))
          try:
              html = get(TGJU)
              cands = {number(m) for m in re.findall(r"\d[\d,٬]{5,}", html)}
              cands = sorted(n for n in cands if n and 100000 <= n <= 20000000)
              if not cands:
                  raise ValueError("no valid value on TGJU")

              if old_usd:
                  rial = min(cands, key=lambda x: abs(x - old_usd * 10))
              else:
                  rial = cands[len(cands) // 2]

              toman = rial / 10
              if not (10000 <= toman <= 2000000):
                  raise ValueError("sanity check failed")

              new = round(accept(old_usd, toman), 2)
              data["usdToman"] = new
              success("usd", new != old_usd)
              print("USD/Toman:", new)
          except Exception as e:
              fail("usd", e)

          # -------------------------
          # GRAM / TON - CoinGecko
          # -------------------------
          old_gram = number(data.get("gramUsd"))
          try:
              j = get_json(GRAM)
              new = accept(old_gram, number(j["the-open-network"]["usd"]))
              data["gramUsd"] = new
              success("gram", new != old_gram)
              print("GRAM:", new)
          except Exception as e:
              fail("gram", e)

          # -------------------------
          # Fragment - Stars & Premium
          # -------------------------
          token = (os.environ.get("APIFRAGMENT_TOKEN") or "").strip()
          premium = data.get("premium", [])
          months_map = {"prem3m": 3, "prem6m": 6, "prem1y": 12}

          if token:
              headers = {
                  "Authorization": "Bearer " + token,
                  "User-Agent": "DevilShop/1.0",
              }

              old_star = number(data.get("starUsd"))
              try:
                  j = get_json(FRAGMENT + "?product=stars&quantity=1000", headers)
                  new = accept(old_star, number(j.get("unit_usdt")))
                  data["starUsd"] = new
                  success("stars", new != old_star)
                  print("Star USD:", new)
              except Exception as e:
                  fail("stars", e)

              for item in premium:
                  key = item.get("key", "")
                  months = months_map.get(key)
                  if not months:
                      continue
                  old_p = number(item.get("usd"))
                  try:
                      j = get_json(
                          FRAGMENT + f"?product=premium&quantity={months}", headers
                      )
                      new = accept(old_p, number(j.get("price_usdt")))
                      item["usd"] = new
                      success(key, new != old_p)
                      print(key, "USD:", new)
                  except Exception as e:
                      fail(key, e)

              data["premium"] = premium
              data["fragmentSource"] = "ApiFragment"
          else:
              for name in ["stars"] + list(months_map):
                  fail(name, "APIFRAGMENT_TOKEN not found")

          # -------------------------
          # SAVE (only if something changed)
          # -------------------------
          stamps = [s["updatedAt"] for s in sources.values() if s.get("updatedAt")]
          if stamps:
              data["updatedAt"] = max(stamps)   # last successful update of any source
          data["anyStale"] = any(s.get("stale") for s in sources.values())
          data["source"] = "TGJU + CoinGecko + Fragment"

          new_text = json.dumps(data, ensure_ascii=False, indent=2)
          if new_text.strip() != original_text.strip():
              with open(FILE, "w", encoding="utf-8") as f:
                  f.write(new_text + "\n")
              print("prices.json updated")
          else:
              print("No changes to save")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices"
            git pull --rebase
            git push
          fi

name: Update Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update prices
        env:
          APIFRAGMENT_TOKEN: ${{ secrets.APIFRAGMENT_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone, timedelta

          FILE = "data/prices.json"

          TGJU = "https://www.tgju.org/profile/price_dollar_rl"

          GRAM = (
              "https://api.coingecko.com/api/v3/simple/price"
              "?ids=the-open-network&vs_currencies=usd"
          )

          FRAGMENT = "https://apifragment.online/price"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/html,*/*"
          }

          STALE_AFTER = timedelta(minutes=60)  # failing longer than this => stale
          HEARTBEAT = timedelta(hours=6)       # refresh updatedAt at least this often
          MAX_CHANGE = 0.25                    # reject >25% jump in a single run

          now = datetime.now(timezone.utc)

          def iso(d):
              return d.isoformat(timespec="seconds")

          # ---------------------------------------------------------
          # HTTP
          # ---------------------------------------------------------

          def get(url, headers=None, retries=3):
              h = dict(HEADERS)
              if headers:
                  h.update(headers)

              last = None

              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers=h, method="GET")
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return r.read().decode("utf-8", errors="replace")

                  except urllib.error.HTTPError as e:
                      last = e
                      print(f"Request failed ({i + 1}/{retries}): HTTP {e.code}")
                      # 4xx (except 429) will not fix itself
                      if e.code < 500 and e.code != 429:
                          break

                  except Exception as e:
                      last = e
                      print(f"Request failed ({i + 1}/{retries}): {e}")

                  if i < retries - 1:
                      time.sleep(3)

              raise last

          def get_json(url, headers=None):
              return json.loads(get(url, headers=headers))

          # ---------------------------------------------------------
          # NUMBERS
          # ---------------------------------------------------------

          def clean_number(value):
              value = str(value)
              value = value.translate(str.maketrans("۰۱۲۳۴۵۶۷۸۹", "0123456789"))
              for ch in (",", "٬", " ", "\u200c"):
                  value = value.replace(ch, "")
              return value

          def to_float(value):
              if value is None:
                  return None
              try:
                  return float(clean_number(value))
              except Exception:
                  return None

          def accept(old, new):
              """Validate a new value against the previous one."""
              if new is None or new <= 0:
                  raise RuntimeError("value missing or invalid")
              if old and old > 0 and abs(new - old) / old > MAX_CHANGE:
                  raise RuntimeError(f"suspicious change {old} -> {new}")
              return new

          # ---------------------------------------------------------
          # LOAD EXISTING DATA
          # ---------------------------------------------------------

          with open(FILE, "r", encoding="utf-8") as f:
              original_text = f.read()

          prices = json.loads(original_text)
          sources = prices.setdefault("sources", {})

          old_usd = to_float(prices.get("usdToman"))
          old_gram = to_float(prices.get("gramUsd"))
          old_star = to_float(prices.get("starUsd"))
          old_premium = prices.get("premium", [])

          print("Old USD/Toman:", old_usd)
          print("Old GRAM USD:", old_gram)
          print("Old Stars USD:", old_star)

          # ---------------------------------------------------------
          # PER-SOURCE STATUS
          # ---------------------------------------------------------

          def success(name, changed):
              s = sources.setdefault(name, {})
              recovered = bool(s.get("failedSince") or s.get("stale"))
              s.pop("failedSince", None)
              s.pop("error", None)
              s["stale"] = False

              last = s.get("updatedAt")
              old_enough = (not last) or (
                  now - datetime.fromisoformat(last) >= HEARTBEAT
              )

              if changed or recovered or old_enough:
                  s["updatedAt"] = iso(now)

          def fail(name, err):
              s = sources.setdefault(name, {})
              s.setdefault("failedSince", iso(now))
              s["error"] = str(err)[:80]
              since = datetime.fromisoformat(s["failedSince"])
              s["stale"] = (now - since) >= STALE_AFTER
              print(f"::warning::{name} failed: {err}")
              print(f"Keeping previous value for {name}")

          # ---------------------------------------------------------
          # USD FROM TGJU
          # ---------------------------------------------------------

          NUM_RE = r"[0-9۰-۹]{1,3}(?:[,٬][0-9۰-۹]{3})+"

          def numbers_in(part):
              out = []
              for n in re.findall(NUM_RE, part):
                  try:
                      value = int(clean_number(n))
                  except Exception:
                      continue
                  if 100000 <= value <= 20000000:
                      out.append(value)
              return out

          try:
              print("\nFetching USD from TGJU...")

              html = get(TGJU)
              print("TGJU page size:", len(html))

              candidates = []

              # Method 1: around price_dollar_rl
              for m in re.finditer(r"price_dollar_rl", html, re.I):
                  part = html[max(0, m.start() - 2000): m.start() + 5000]
                  candidates += numbers_in(part)

              # Method 2: after "نرخ فعلی"
              for m in re.finditer(r"نرخ\s*فعلی", html):
                  part = html[m.start(): m.start() + 3000]
                  candidates += numbers_in(part)

              candidates = list(dict.fromkeys(candidates))
              print("TGJU candidates:", candidates[:20])

              if not candidates:
                  raise RuntimeError("No valid USD value found")

              if old_usd:
                  target = old_usd * 10
                  usd_rial = min(candidates, key=lambda x: abs(x - target))
              else:
                  usd_rial = candidates[0]

              usd_toman = round(usd_rial / 10)

              if not (10000 <= usd_toman <= 2000000):
                  raise RuntimeError(f"Invalid USD/Toman: {usd_toman}")

              usd_toman = accept(old_usd, usd_toman)

              prices["usdToman"] = usd_toman
              success("usd", usd_toman != old_usd)
              print("USD Rial:", usd_rial)
              print("USD Toman:", usd_toman)

          except Exception as e:
              fail("usd", e)

          # ---------------------------------------------------------
          # GRAM / TONCOIN
          # ---------------------------------------------------------

          try:
              print("\nFetching GRAM...")

              data = get_json(GRAM)
              value = to_float(data.get("the-open-network", {}).get("usd"))
              gram_usd = accept(old_gram, value)

              prices["gramUsd"] = gram_usd
              success("gram", gram_usd != old_gram)
              print("GRAM USD:", gram_usd)

          except Exception as e:
              fail("gram", e)

          # ---------------------------------------------------------
          # APIFRAGMENT
          # ---------------------------------------------------------

          PREMIUM_SPECS = [
              (3, "prem3m", "پریمیوم 3 ماهه"),
              (6, "prem6m", "پریمیوم 6 ماهه"),
              (12, "prem1y", "پریمیوم 1 ساله"),
          ]

          token = (os.environ.get("APIFRAGMENT_TOKEN") or "").strip()

          if token:
              print("\nAPIFRAGMENT_TOKEN found.")

              fragment_headers = {"Authorization": "Bearer " + token}

              # ---- STARS ----
              try:
                  url = FRAGMENT + "?product=stars&quantity=1000"
                  print("Requesting Stars:", url)

                  data = get_json(url, fragment_headers)

                  if data.get("unit_usdt") is not None:
                      value = to_float(data["unit_usdt"])
                  elif data.get("price_usdt") is not None:
                      value = to_float(data["price_usdt"])
                      value = value / 1000 if value else None
                  else:
                      raise RuntimeError("Stars USD missing")

                  star_usd = accept(old_star, value)

                  prices["starUsd"] = star_usd
                  success("stars", star_usd != old_star)
                  print("Stars USD:", star_usd)

              except Exception as e:
                  fail("stars", e)

              # ---- PREMIUM ----
              existing = {x.get("key"): x for x in old_premium if x.get("key")}
              new_premium = []

              for months, key, name in PREMIUM_SPECS:
                  item = existing.pop(key, None) or {"key": key, "name": name}
                  old_value = to_float(item.get("usd"))

                  try:
                      url = FRAGMENT + f"?product=premium&quantity={months}"
                      print(f"Requesting Premium {months}m:", url)

                      data = get_json(url, fragment_headers)
                      value = accept(old_value, to_float(data.get("price_usdt")))

                      item["usd"] = value
                      success(key, value != old_value)
                      print(f"Premium {months}m USD:", value)

                  except Exception as e:
                      fail(key, e)

                  # keep the item only if it has a price (new or previous)
                  if item.get("usd") is not None:
                      new_premium.append(item)

              # keep any extra items that are not managed here
              new_premium.extend(existing.values())
              prices["premium"] = new_premium
              prices["fragmentSource"] = "ApiFragment"

          else:
              print("\nAPIFRAGMENT_TOKEN not found")
              for name in ["stars"] + [k for _, k, _ in PREMIUM_SPECS]:
                  fail(name, "APIFRAGMENT_TOKEN not found")

          # ---------------------------------------------------------
          # SAVE (only when something changed)
          # ---------------------------------------------------------

          stamps = [s["updatedAt"] for s in sources.values() if s.get("updatedAt")]
          if stamps:
              prices["updatedAt"] = max(stamps)  # last real successful update

          prices["anyStale"] = any(s.get("stale") for s in sources.values())
          prices["source"] = "TGJU + CoinGecko + Fragment"

          new_text = json.dumps(prices, ensure_ascii=False, indent=2)

          if new_text.strip() != original_text.strip():
              with open(FILE, "w", encoding="utf-8") as f:
                  f.write(new_text + "\n")
              print("\nprices.json updated")
          else:
              print("\nNo changes to save")

          print("PRICE UPDATE FINISHED")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices"
            git pull --rebase
            git push
          fi

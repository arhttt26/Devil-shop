name: Update Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Update live prices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APIFRAGMENT_TOKEN: ${{ secrets.APIFRAGMENT_TOKEN }}
        run: |
          python3 <<'PY'
          import urllib.request
          import json
          import base64
          import os
          import re
          from html import unescape
          from html.parser import HTMLParser
          from datetime import datetime, timezone

          TGJU_URL = "https://www.tgju.org/profile/price_dollar_rl"
          COINGECKO_URL = "https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd"
          APIFRAGMENT_URL = "https://apifragment.online/price"

          def get(url, headers=None):
              req = urllib.request.Request(
                  url,
                  headers=headers or {
                      "User-Agent": "Mozilla/5.0 Devil-Shop-Price-Updater",
                      "Accept": "application/json,text/html;q=0.9,*/*;q=0.8"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read()

          def fetch_json(url, headers=None):
              return json.loads(get(url, headers).decode("utf-8"))

          # =========================
          # USD / Toman - TGJU
          # =========================

          html = get(TGJU_URL).decode("utf-8", errors="ignore")

          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          parser = TextParser()
          parser.feed(html)

          text = re.sub(
              r"\s+",
              " ",
              unescape(" ".join(parser.parts))
          )

          patterns = [
              r"قیمت هر دلار\s+([0-9۰-۹٬,]+)\s*ریال",
              r"قیمت دلار\s+([0-9۰-۹٬,]+)\s*ریال",
              r"نرخ فعلی[:\s]+([0-9۰-۹٬,]+)",
              r"Last[:\s]+([0-9,]+)"
          ]

          match = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              raise Exception("USD price not found on TGJU")

          raw = match.group(1).translate(
              str.maketrans(
                  "۰۱۲۳۴۵۶۷۸۹",
                  "0123456789"
              )
          )

          digits = re.sub(r"[^0-9]", "", raw)

          if not digits:
              raise Exception("USD price is not numeric")

          usd_rial = int(digits)

          if not 1_000_000 <= usd_rial <= 10_000_000:
              raise Exception(
                  f"Invalid USD Rial price: {usd_rial}"
              )

          usd_toman = round(usd_rial / 10)

          # =========================
          # GRAM / USD - CoinGecko
          # =========================

          gram_data = fetch_json(
              COINGECKO_URL,
              {
                  "User-Agent": "Devil-Shop-Price-Updater",
                  "Accept": "application/json"
              }
          )

          gram_usd = float(
              gram_data["the-open-network"]["usd"]
          )

          if not 0 < gram_usd < 100:
              raise Exception(
                  f"Invalid GRAM USD price: {gram_usd}"
              )

          # =========================
          # Get current prices.json
          # =========================

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          api_url = (
              f"https://api.github.com/repos/"
              f"{repo}/contents/data/prices.json"
          )

          current_response = fetch_json(
              api_url,
              {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Devil-Shop-Price-Updater"
              }
          )

          current_sha = current_response["sha"]

          prices = json.loads(
              base64.b64decode(
                  current_response["content"]
              ).decode("utf-8")
          )

          # =========================
          # Fragment prices
          # =========================

          api_token = os.environ.get(
              "APIFRAGMENT_TOKEN",
              ""
          ).strip()

          if api_token:

              common_headers = {
                  "Authorization": f"Bearer {api_token}",
                  "Accept": "application/json",
                  "User-Agent": "Devil-Shop-Price-Updater"
              }

              # Stars
              star_quote = fetch_json(
                  APIFRAGMENT_URL
                  + "?product=stars"
                  + "&quantity=1000"
                  + "&payment_method=usdt_ton",
                  common_headers
              )

              star_usd = (
                  float(star_quote["price_usdt"])
                  / 1000.0
              )

              # Premium
              premium_quotes = {}

              for months, key in [
                  (3, "prem3m"),
                  (6, "prem6m"),
                  (12, "prem1y")
              ]:

                  quote = fetch_json(
                      APIFRAGMENT_URL
                      + f"?product=premium"
                      + f"&quantity={months}"
                      + "&payment_method=usdt_ton",
                      common_headers
                  )

                  premium_quotes[key] = float(
                      quote["price_usdt"]
                  )

              if star_usd <= 0:
                  raise Exception(
                      "Invalid Stars USD quote"
                  )

              for key, value in premium_quotes.items():
                  if value <= 0:
                      raise Exception(
                          f"Invalid Premium USD quote for {key}"
                      )

              prices["starUsd"] = star_usd

              for item in prices.get("premium", []):

                  if item.get("key") in premium_quotes:

                      item["usd"] = premium_quotes[
                          item["key"]
                      ]

              prices["fragmentSource"] = "ApiFragment"

          else:

              print(
                  "APIFRAGMENT_TOKEN is not configured; "
                  "keeping existing Stars/Premium USD values."
              )

              prices["fragmentSource"] = "last-known"

          # =========================
          # Save prices
          # =========================

          prices["usdToman"] = usd_toman
          prices["gramUsd"] = gram_usd

          prices["updatedAt"] = (
              datetime.now(timezone.utc).isoformat()
          )

          prices["source"] = (
              "TGJU + CoinGecko + Fragment"
          )

          new_content = (
              json.dumps(
                  prices,
                  ensure_ascii=False,
                  indent=2
              )
              + "\n"
          )

          encoded = base64.b64encode(
              new_content.encode("utf-8")
          ).decode("ascii")

          # =========================
          # Update GitHub file
          # =========================

          payload = {
              "message": "Update live prices",
              "content": encoded,
              "sha": current_sha
          }

          upload = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode("utf-8"),
              method="PUT",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Devil-Shop-Price-Updater"
              }
          )

          with urllib.request.urlopen(
              upload,
              timeout=30
          ) as response:

              result = json.loads(
                  response.read().decode("utf-8")
              )

          print("==============================")
          print("prices.json updated successfully.")
          print("USD Toman:", usd_toman)
          print("GRAM USD:", gram_usd)
          print("Stars USD:", prices.get("starUsd"))
          print("Premium:", prices.get("premium"))
          print("Commit:", result["commit"]["sha"])
          print("==============================")
          PY

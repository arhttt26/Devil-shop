name: Update Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get USD price and update prices.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.error
          import re
          import json
          import base64
          import os
          from html import unescape
          from html.parser import HTMLParser
          from datetime import datetime, timezone

          TGJU_URL = "https://www.tgju.org/profile/price_dollar_rl"

          # 1. Download TGJU page
          request = urllib.request.Request(
              TGJU_URL,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print("TGJU page downloaded.")
          print("Page size:", len(html))

          # 2. Convert HTML to text
          class TextParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []

              def handle_data(self, data):
                  self.parts.append(data)

          parser = TextParser()
          parser.feed(html)

          text = unescape(" ".join(parser.parts))
          text = re.sub(r"\s+", " ", text)

          # 3. Find USD price
          patterns = [
              r"قیمت هر دلار\s+([0-9۰-۹٬,]+)\s*ریال",
              r"قیمت دلار\s+([0-9۰-۹٬,]+)\s*ریال",
              r"نرخ فعلی[:\s]+([0-9۰-۹٬,]+)",
              r"Last[:\s]+([0-9,]+)"
          ]

          match = None

          for pattern in patterns:
              match = re.search(
                  pattern,
                  text,
                  flags=re.IGNORECASE
              )

              if match:
                  break

          if not match:
              print("Could not find USD price.")
              print(text[:5000])
              raise Exception(
                  "USD price not found on TGJU"
              )

          raw = match.group(1)

          # Persian digits -> English digits
          translation = str.maketrans(
              "۰۱۲۳۴۵۶۷۸۹",
              "0123456789"
          )

          raw = raw.translate(translation)

          digits = re.sub(
              r"[^0-9]",
              "",
              raw
          )

          if not digits:
              raise Exception(
                  "USD price is not numeric"
              )

          usd_rial = int(digits)

          # 4. Validate price
          if not (
              1_000_000
              <= usd_rial
              <= 10_000_000
          ):
              raise Exception(
                  f"Invalid USD Rial price: {usd_rial}"
              )

          usd_toman = round(
              usd_rial / 10
          )

          print("------------------------------")
          print("USD Rial :", usd_rial)
          print("USD Toman:", usd_toman)
          print("------------------------------")

          # 5. GitHub API
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          api_url = (
              f"https://api.github.com/repos/"
              f"{repo}/contents/data/prices.json"
          )

          api_request = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Devil-Shop-Price-Updater"
              }
          )

          with urllib.request.urlopen(
              api_request,
              timeout=30
          ) as response:
              current_response = json.loads(
                  response.read().decode("utf-8")
              )

          current_sha = current_response["sha"]

          current_content = base64.b64decode(
              current_response["content"]
          ).decode("utf-8")

          prices = json.loads(current_content)

          # 6. Update USD price
          prices["usdToman"] = usd_toman
          prices["updatedAt"] = datetime.now(
              timezone.utc
          ).isoformat()

          prices["source"] = "TGJU"

          # 7. Prepare JSON
          new_content = json.dumps(
              prices,
              ensure_ascii=False,
              indent=2
          ) + "\n"

          encoded_content = base64.b64encode(
              new_content.encode("utf-8")
          ).decode("ascii")

          # 8. Update file on GitHub
          payload = {
              "message": "Update USD price",
              "content": encoded_content,
              "sha": current_sha
          }

          upload_data = json.dumps(
              payload
          ).encode("utf-8")

          upload_request = urllib.request.Request(
              api_url,
              data=upload_data,
              method="PUT",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Devil-Shop-Price-Updater"
              }
          )

          with urllib.request.urlopen(
              upload_request,
              timeout=30
          ) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          print("==============================")
          print("prices.json updated successfully.")
          print("USD Toman:", usd_toman)
          print("Commit:", result["commit"]["sha"])
          print("==============================")
          PY

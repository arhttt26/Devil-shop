name: Update Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update prices
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APIFRAGMENT_TOKEN: ${{ secrets.APIFRAGMENT_TOKEN }}


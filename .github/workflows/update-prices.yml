name: Update Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update prices
        env:
          APIFRAGMENT_TOKEN: ${{ secrets.APIFRAGMENT_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          FILE = "data/prices.json"

          TGJU = "https://www.tgju.org/profile/price_dollar_rl"
          GRAM = "https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd"
          FRAGMENT = "https://apifragment.online/price"

          def get(url, headers=None):
              req = urllib.request.Request(
                  url,
                  headers=headers or {
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def get_json(url, headers=None):
              return json.loads(get(url, headers))

          def number(x):
              if x is None:
                  return None
              x = str(x).replace(",", "").replace("٬", "").strip()
              try:
                  return float(x)
              except:
                  return None

          with open(FILE, "r", encoding="utf-8") as f:
              data = json.load(f)

          old_usd = number(data.get("usdToman"))
          old_gram = number(data.get("gramUsd"))
          old_star = number(data.get("starUsd"))

          print("Old USD/Toman:", old_usd)
          print("Old GRAM:", old_gram)
          print("Old Stars:", old_star)

          # -------------------------
          # USD / TOMAN - TGJU
          # -------------------------
          try:
              html = get(TGJU)

              candidates = []

              for match in re.findall(r"\d[\d,٬]{5,}", html):
                  n = number(match)
                  if n and 100000 <= n <= 20000000:
                      candidates.append(n)

              candidates = list(set(candidates))

              if candidates:
                  if old_usd:
                      target = old_usd * 10
                      rial = min(candidates, key=lambda x: abs(x - target))
                  else:
                      rial = candidates[0]

                  toman = rial / 10

                  if 10000 <= toman <= 2000000:
                      data["usdToman"] = round(toman, 2)
                      print("New USD/Toman:", data["usdToman"])
                  else:
                      print("TGJU value failed sanity check")

              else:
                  print("No valid USD value found on TGJU")

          except Exception as e:
              print("TGJU ERROR:", e)
              print("Keeping old USD/Toman")

          # -------------------------
          # GRAM / TON
          # -------------------------
          try:
              j = get_json(GRAM)
              gram = number(j["the-open-network"]["usd"])

              if gram and gram > 0:
                  data["gramUsd"] = gram
                  print("New GRAM:", gram)

          except Exception as e:
              print("GRAM ERROR:", e)
              print("Keeping old GRAM")

          # -------------------------
          # FRAGMENT API
          # -------------------------
          token = ( __import__("os").environ.get("APIFRAGMENT_TOKEN") or "" ).strip()

          if token:
              headers = {
                  "Authorization": "Bearer " + token,
                  "User-Agent": "DevilShop/1.0"
              }

              # Stars
              try:
                  j = get_json(
                      FRAGMENT + "?product=stars&quantity=1000",
                      headers
                  )

                  star = number(j.get("unit_usdt"))

                  if star and star > 0:
                      data["starUsd"] = star
                      print("New Star USD:", star)
                  else:
                      print("Stars value missing")

              except Exception as e:
                  print("STARS ERROR:", e)
                  print("Keeping old Stars")

              # Premium
              premium = data.get("premium", [])

              for item in premium:
                  key = item.get("key", "")

                  months = {
                      "prem3m": 3,
                      "prem6m": 6,
                      "prem1y": 12
                  }.get(key)

                  if not months:
                      continue

                  try:
                      j = get_json(
                          FRAGMENT +
                          f"?product=premium&quantity={months}",
                          headers
                      )

                      price = number(j.get("price_usdt"))

                      if price and price > 0:
                          item["usd"] = price
                          print(key, "USD:", price)
                      else:
                          print(key, "value missing")

                  except Exception as e:
                      print(key, "ERROR:", e)
                      print("Keeping old", key)

              data["premium"] = premium
              data["fragmentSource"] = "ApiFragment"

          else:
              print("APIFRAGMENT_TOKEN not found")
              print("Keeping old Stars and Premium")

          # -------------------------
          # SAVE
          # -------------------------
          data["updatedAt"] = datetime.now(timezone.utc).isoformat()
          data["source"] = "TGJU + CoinGecko + Fragment"

          with open(FILE, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("PRICE UPDATE SUCCESSFUL")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "Update prices"
            git push
          fi

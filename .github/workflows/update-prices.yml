              if value is None:
                  return None

              value = str(value)

              value = value.translate(
                  PERSIAN_DIGITS
              )

              value = value.replace(
                  "٬",
                  ""
              )

              value = value.replace(
                  ",",
                  ""
              )

              value = value.replace(
                  " ",
                  ""
              )

              value = value.replace(
                  "\u200c",
                  ""
              )

              return value


          # =========================================================
          # LOAD EXISTING PRICES
          # =========================================================

          if not os.path.exists(PRICES_FILE):

              raise RuntimeError(
                  f"{PRICES_FILE} does not exist"
              )


          with open(
              PRICES_FILE,
              "r",
              encoding="utf-8"
          ) as file:

              prices = json.load(file)


          old_usd_toman = prices.get(
